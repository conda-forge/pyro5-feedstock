{% set version = "5.17" %}

package:
  name: pyro5
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/P/Pyro5/pyro5-{{ version }}.tar.gz
  sha256: cfac69638d80943aff9cc5f1466755dd0fef8aed0bb4bda41b5eb045818ce6fc

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - pyro5-ns = Pyro5.nameserver:main
    - pyro5-nsc = Pyro5.nsc:main
    - pyro5-echoserver = Pyro5.utils.echoserver:main
    - pyro5-check-config = Pyro5.configure:dump
    - pyro5-httpgateway = Pyro5.utils.httpgateway:main


requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - serpent >=1.27

  run:
    - python >={{ python_min }}
    - serpent >=1.27

test:
  requires:
    - python {{ python_min }}
  imports:
    - Pyro5
    - Pyro5.compatibility
    - Pyro5.utils

  commands:
    - pyro5-ns --help
    - pyro5-nsc --help
    - pyro5-echoserver --help
    - pyro5-check-config --help
    - pyro5-httpgateway --help

about:
  home: https://pyro5.readthedocs.io
  license: MIT
  license_file: LICENSE
  summary: Distributed object middleware for Python (RPC)

extra:
  recipe-maintainers:
    - irmen
